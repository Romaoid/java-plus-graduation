eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: analyzer
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

cloud:
  config:
    fail-fast: true
    retry:
      max-attempts: 6
      initial-interval: 1000
      multiplier: 1.1
      max-interval: 2000