server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: comment-service-read
          uri: lb://comment-service
          predicates:
            - Path=/events/{eventId}/comment**, /admin/comments
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: event-service-read
          uri: lb://event-service
          predicates:
            - Path=/admin/events, /users/{uId}/events, /users/{uId}/events/{eId}, /events/**, /compilations/**, /admin/compilations/**, /categories/**, /admin/categories
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: request-service-read
          uri: lb://request-service
          predicates:
            - Path=/users/{uId}/events/{eId}/requests, /users/{uId}/requests
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: user-service-write
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: event-service-write
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**, /admin/compilations/**, /admin/events/**, /admin/categories, /admin/compilations, /users/{uId}/events, /users/{uId}/events/{eId}
        - id: request-service-write
          uri: lb://request-service
          predicates:
            - Path=/users/{uId}/events/{eId}/requests, /users/{uId}/requests, /users/{uId}/requests/**
        - id: comment-service-write
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**, /users/{userId}/events/{eventId}/comments, /users/{userId}/events/{eventId}/comments/**