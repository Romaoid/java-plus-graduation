server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service-admin-read
          uri: lb://user-service
          predicates:
            - Path=/admin/users
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: event-service-read
          uri: lb://event-service
          predicates:
            - Path=/admin/events, /users/{userId}/events, /users/{userId}/events/{id}, /events/**, /compilations/**, /admin/compilations/**, /categories/**, /admin/categories
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: user-service-admin-write
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: event-service-admin-write
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**, /admin/compilations/**, /admin/events/**, /admin/categories, /admin/compilations, /users/{userId}/events, /users/{userId}/events/{id}