spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://ewm-db:5432/event-service
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      continue-on-error: false

grpc:
  client:
    analyzer:
      address: 'discovery:///analyzer'
      negotiationType: PLAINTEXT
    collector:
      address: 'discovery:///collector'
      negotiationType: PLAINTEXT

server:
  port: 0