spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://ewm-db:5432/ewm-main
    username: main
    password: main
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

client:
  url: stats-server

stats:
  service:
    id: stats-server
  retry:
    max-attempts: 3
    backoff-ms: 3000

server:
  port: 0

