services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true

  ewm-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ewm
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16
    depends_on:
      ewm-db:
        condition: service_healthy
    volumes:
      - ./schemas:/schemas:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        psql postgresql://ewm:ewm@ewm-db:5432/postgres -v ON_ERROR_STOP=1 <<-EOSQL
          CREATE DATABASE "ewm-stats" OWNER ewm;
          CREATE DATABASE "user-service" OWNER ewm;
          CREATE DATABASE "request-service" OWNER ewm;
          CREATE DATABASE "event-service" OWNER ewm;
          CREATE DATABASE "comment-service" OWNER ewm;
        EOSQL
        psql postgresql://ewm:ewm@ewm-db:5432/ewm-stats -f /schemas/schema-stat.sql
        psql postgresql://ewm:ewm@ewm-db:5432/user-service -f /schemas/schema-user.sql
        psql postgresql://ewm:ewm@ewm-db:5432/request-service -f /schemas/schema-request.sql
        psql postgresql://ewm:ewm@ewm-db:5432/event-service -f /schemas/schema-event.sql
        psql postgresql://ewm:ewm@ewm-db:5432/comments-service -f /schemas/schema-comment.sql

volumes:
  pgdata: