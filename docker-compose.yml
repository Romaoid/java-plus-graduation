services:
  ewm-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ewm
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16
    depends_on:
      ewm-db:
        condition: service_healthy
    volumes:
      - ./schemas:/schemas:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        psql postgresql://ewm:ewm@ewm-db:5432/postgres -v ON_ERROR_STOP=1 <<-EOSQL
          CREATE DATABASE "ewm-stats" OWNER ewm;
          CREATE DATABASE "user-service" OWNER ewm;
          CREATE DATABASE "request-service" OWNER ewm;
          CREATE DATABASE "event-service" OWNER ewm;
          CREATE DATABASE "comment-service" OWNER ewm;
        EOSQL
        psql postgresql://ewm:ewm@ewm-db:5432/ewm-stats -f /schemas/schema-stat.sql
        psql postgresql://ewm:ewm@ewm-db:5432/user-service -f /schemas/schema-user.sql
        psql postgresql://ewm:ewm@ewm-db:5432/request-service -f /schemas/schema-request.sql
        psql postgresql://ewm:ewm@ewm-db:5432/event-service -f /schemas/schema-event.sql
        psql postgresql://ewm:ewm@ewm-db:5432/comments-service -f /schemas/schema-comment.sql

volumes:
  pgdata: